name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./... && GOOS=windows go vet ./...
      - run: go test ./...
      - run: GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w" -o dist/log-time.exe .
      - run: cd dist && sha256sum log-time.exe > log-time.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: log-time
          path: dist/
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/log-time.exe
            dist/log-time.exe.sha256
